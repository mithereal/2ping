name: Release Multi-Arch Binaries & Docker
on:
push:
tags:
- "v*"
permissions:
contents: write
packages: write
jobs:
build-binaries:
strategy:
matrix:
include:
- target: x86_64-unknown-linux-musl
os: ubuntu-latest
artifact_name: 2ping-linux-amd64
use_cross: true
features: ""
- target: x86_64-unknown-linux-musl
os: ubuntu-latest
artifact_name: 2ping-linux-amd64-webhooks
use_cross: true
features: "--features webhooks"
- target: aarch64-unknown-linux-musl
os: ubuntu-latest
artifact_name: 2ping-linux-arm64
use_cross: true
features: ""
- target: aarch64-unknown-linux-musl
os: ubuntu-latest
artifact_name: 2ping-linux-arm64-webhooks
use_cross: true
features: "--features webhooks"
- target: aarch64-apple-darwin
os: macos-latest
artifact_name: 2ping-macos-arm64
use_cross: false
features: ""
runs-on: ${{ matrix.os }}
steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Install Rust toolchain
uses: dtolnay/rust-toolchain@stable
with:
targets: ${{ matrix.target }}
- name: Install cross
if: matrix.use_cross
run: cargo install cross --git github.com
- name: Build release binary
run: |
if [ "${{ matrix.use_cross }}" = "true" ]; then
cross build --release --target ${{ matrix.target }} ${{ matrix.features }}
else
cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}
fi
- name: Package binary tarball
run: |
mkdir -p dist
cp target/${{ matrix.target }}/release/2ping dist/2ping
tar -czvf ${{ matrix.artifact_name }}.tar.gz -C dist 2ping
sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
- name: Upload to GitHub Release
uses: softprops/action-gh-release@v2
with:
files: |
${{ matrix.artifact_name }}.tar.gz
${{ matrix.artifact_name }}.tar.gz.sha256
build-docker:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Set up QEMU
uses: docker/setup-qemu-action@v3
- name: Set up Docker Buildx
uses: docker/setup-buildx-action@v3
- name: Log in to GitHub Container Registry
uses: docker/login-action@v3
with:
registry: ghcr.io
username: ${{ github.actor }}
password: ${{ secrets.GITHUB_TOKEN }}
- name: Extract Docker metadata
id: meta
uses: docker/metadata-action@v5
with:
images: ghcr.io/${{ github.repository }}
tags: |
type=semver,pattern={{version}}
type=semver,pattern={{major}}.{{minor}}
type=raw,value=latest
- name: Build and push multi-arch Docker image
uses: docker/build-push-action@v6
with:
context: .
platforms: linux/amd64,linux/arm64
push: true
tags: ${{ steps.meta.outputs.tags }}
labels: ${{ steps.meta.outputs.labels }}
cache-from: type=gha
cache-to: type=gha,mode=max

