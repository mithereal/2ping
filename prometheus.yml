scrape_configs:
  - job_name: "twoping"
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "10.0.0.5:9100"    # Replace with your 2ping host IP and --metrics-port
          - "10.0.0.12:9100"
        labels:
          service: "2ping"
          env: "production"
