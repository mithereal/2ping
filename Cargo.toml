[package]
name = "twoping"
version = "1.0.0"
edition = "2021"
description = "Enterprise bi-directional ping utility in Rust with OWD, TUI, multi-key rotation, multi-target probing, dual-stack IPv6, DNS SRV, Path MTU discovery, ChaCha20-Poly1305 AEAD, kernel timestamps, and Prometheus metrics"

[[bin]]
name = "2ping"
path = "src/main.rs"

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
hickory-resolver = "0.24"
hmac = "0.12"
libc = "0.2"
md-5 = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
ratatui = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
subtle = "2.5"
tokio = { version = "1.37", features = ["full"] }
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
