[package]
name = "twoping"
version = "0.4.0"
edition = "2021"
description = "A bi-directional ping utility written in Rust with ChaCha20-Poly1305 AEAD, anti-replay, kernel timestamps, DSCP, Prometheus metrics, and JSON telemetry"

[[bin]]
name = "2ping"
path = "src/main.rs"

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
libc = "0.2"
md-5 = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
subtle = "2.5"
tokio = { version = "1.37", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
